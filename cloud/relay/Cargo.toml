[package]
name = "opscode-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3.107", features = ["Crypto", "WorkerGlobalScope"] }
worker = "=0.9.0"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
codegen-units = 1

<!doctype html>
<html lang="en" data-overlay>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <!-- The overlay (src/main/overlay.ts): a clear window over the screen. It is told what to draw; no runtime endpoint
         reaches it. Opened in a plain browser it shows a demo: overlay.html?demo=working | workers -->
    <title>Opscode Overlay</title>
    <link rel="stylesheet" href="./overlay.css" />
    <script type="module" src="./overlay.js"></script>
  </head>
  <body>
    <div class="edge" aria-hidden="true"></div>
    <canvas class="px" aria-hidden="true"></canvas>
    <div class="frametag" aria-hidden="true"><i></i><b>OPSCODE</b><span></span></div>
    <div class="caption" role="status" aria-live="polite"><span class="led"></span><span class="what"></span></div>
    <div class="gallery" hidden></div>
  </body>
</html>

name: dealker_vendor
description: Dealker Vendor Hub — B2B + B2C vendor, retailer and repair-partner app
publish_to: none
version: 1.0.32+33

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  go_router: ^14.2.0
  dio: ^5.6.0
  socket_io_client: ^2.0.3+1
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.1.0
  synchronized: ^3.1.0+1
  pinput: ^5.0.0
  phosphoricons_flutter: ^1.0.0
  gap: ^3.0.1
  intl: ^0.19.0
  image_picker: ^1.2.4
  cached_network_image: ^3.4.1
  video_player: ^2.14.1
  razorpay_flutter: ^1.4.1
  shared_preferences: ^2.3.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  path_provider: ^2.1.4
  open_file: ^3.5.8
  geolocator: ^14.0.2
  geocoding: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  config:
    # SwiftPM mis-resolves plugin paths when the project path contains spaces
    enable-swift-package-manager: false
  assets:
    - .env
    - assets/images/
    - assets/branding/app_logo.png
    - assets/branding/dealker-logo.png
    - assets/auth/
    - assets/icons/
    - assets/orders/
    - assets/art/
    - assets/categories/
    - assets/banners/
    - assets/brands/
    - assets/3d/repair/
    - assets/3d/sell/
    - assets/3d/profile/
    - assets/3d/help/
    - assets/3d/shops/
    - assets/3d/cart/
    - assets/3d/exchange/
    - assets/3d/new/
    - assets/3d/auction/
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
